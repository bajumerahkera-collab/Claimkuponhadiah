<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLAIM KUPON BERHADIAH UNTUK ANDA</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        h2, h3, .prize-glow {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
        }

        body {
            background-color: #0d0d13;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* --- Efek Animasi Background Canvas --- */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- Live Pemenang Ticker (Teks Berjalan Premium) --- */
        .live-ticker {
            position: fixed;
            top: 20px;
            width: 90%;
            max-width: 450px;
            background: rgba(20, 20, 30, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            overflow: hidden;
        }

        .ticker-badge {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #11111b;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            animation: pulse 1s infinite;
        }

        .ticker-content {
            font-size: 12px;
            color: #e0e0ff;
            white-space: nowrap;
            display: inline-block;
            width: 100%;
        }

        /* --- Container & Kartu Utama --- */
        .container {
            width: 100%;
            max-width: 450px;
            z-index: 5;
            margin-top: 50px;
        }

        .luxury-card {
            background: rgba(30, 30, 47, 0.85);
            padding: 35px 30px;
            border-radius: 25px;
            border: 2px solid rgba(255, 215, 0, 0.4); 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 215, 0, 0.05);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h2 {
            color: #ffd700;
            font-size: 26px;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .subtitle {
            font-size: 13px;
            color: #b3b3cc;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Form Input */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #ffd700;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: #141420;
            border: 2px solid #3b3b5e;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        /* Tombol Utama Emas */
        .btn-gold {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            border: none;
            border-radius: 12px;
            color: #11111b;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 15px rgba(255, 140, 0, 0.3);
            transition: all 0.2s ease;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 140, 0, 0.5);
        }

        /* Sistem Halaman */
        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* Tampilan Hasil Hadiah */
        .gift-icon {
            font-size: 70px;
            margin-bottom: 10px;
            animation: bounce 1.2s infinite alternate;
            display: inline-block;
        }

        .prize-glow {
            font-size: 38px;
            color: #00ffcc; 
            margin: 15px 0;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6), 0 0 30px rgba(0, 255, 204, 0.2);
            animation: pulse 2s infinite ease-in-out;
        }

        /* Tombol Neon */
        .btn-neon {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #00ffcc, #00bfff);
            color: #11111b;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.3);
            margin-top: 25px;
            transition: all 0.3s ease;
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.6);
        }

        /* Animasi Efek */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="live-ticker">
        <span class="ticker-badge">LIVE KLAIM</span>
        <marquee class="ticker-content" id="tickerText" scrollamount="4">Memuat data klaim terbaru...</marquee>
    </div>

    <div class="container">
        <div class="luxury-card">
            
            <div id="formPage" class="page active">
                <h2>KLAIM KUPON BERHADIAH</h2>
                <p class="subtitle">Masukkan User ID dan Kode Kupon Anda untuk membuka hadiah uang tunai instan!</p>
                
                <form id="claimForm">
                    <div class="input-group">
                        <label for="userId">User ID</label>
                        <input type="text" id="userId" placeholder="Contoh: USER77" required>
                    </div>

                    <div class="input-group">
                        <label for="couponCode">Kode Kupon</label>
                        <input type="text" id="couponCode" placeholder="Contoh: KUPON-7821" required>
                    </div>

                    <button type="submit" id="btnClaim" class="btn-gold">KLAIM HADIAH SEKARANG</button>
                </form>
            </div>

            <div id="resultPage" class="page">
                <div class="gift-icon">🎁</div>
                <h3>Selamat! Anda Mendapatkan:</h3>
                <div id="prizeAmount" class="prize-glow">Rp 0</div>
                <p class="subtitle">Hadiah telah ditambahkan ke User ID Anda.</p>
                <a href="https://mampirbetul.com/" id="btnRedirect" class="btn-neon" target="_blank">CLAIM SEKARANG JUGA</a>
            </div>

        </div>
    </div>

    <script>
        // --- 1. LOGIKA ANIMASI BACKGROUND (CANVAS PARTICLES) ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const numberOfParticles = 60;

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1 + 0.2; // Bergerak ke atas lambat
                this.color = `rgba(255, 215, 0, ${Math.random() * 0.4 + 0.1})`; // Variasi opasitas emas
            }
            update() {
                this.y -= this.speedY;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();


        // --- 2. LOGIKA LIVE TICKER PEMENANG ACAK ---
        const nominals = ["Rp 50.000", "Rp 75.000", "Rp 100.000", "Rp 250.000", "Rp 500.000"];
        const tickerText = document.getElementById('tickerText');

        function generateLiveClaim() {
            const randomID = "ID_" + Math.floor(1000 + Math.random() * 9000) + "***";
            const randomNominal = nominals[Math.floor(Math.random() * nominals.length)];
            tickerText.innerText = `🔥 User ${randomID} baru saja sukses mengklaim ${randomNominal}!  •  🔥 Silakan masukkan kode kupon valid Anda untuk ikut mengklaim!`;
        }
        
        // Buat data live berubah setiap 12 detik agar alami
        generateLiveClaim();
        setInterval(generateLiveClaim, 12000);
    </script>
    <script src="script.js"></script>
</body>
</html>
